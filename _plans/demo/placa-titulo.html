<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RemitIA — placa de título (grabar en pantalla completa)</title>
<style>
	* { margin: 0; box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		background: #060d1a;
		font-family: "Segoe UI", system-ui, Arial, sans-serif;
		overflow: hidden; cursor: none;
	}
	.stage {
		position: relative; height: 100%;
		display: flex; flex-direction: column; align-items: center; justify-content: center;
		gap: 2.2vh;
		background: radial-gradient(ellipse 80% 60% at 50% 42%, #0c1e38 0%, #060d1a 70%);
	}
	.logo {
		font-size: 11vw; font-weight: 700; letter-spacing: -0.02em;
		color: #f3f7fc; line-height: 1;
		opacity: 0; transform: translateY(3vh) scale(0.97);
	}
	.logo b { color: #38bdf8; font-weight: 700; }
	.tagline {
		font-size: 2.6vw; font-weight: 400; color: #9fb3cc; letter-spacing: 0.02em;
		opacity: 0; transform: translateY(2vh);
	}
	.chip {
		margin-top: 1.5vh; padding: 1.1vh 1.8vw;
		border: 1px solid #1e3a5c; border-radius: 99px;
		font-size: 1.5vw; font-weight: 600; letter-spacing: 0.22em;
		color: #38bdf8; text-transform: uppercase;
		opacity: 0; transform: translateY(2vh);
	}
	.playing .logo    { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 0.3s forwards; }
	.playing .tagline { animation: rise 1.0s cubic-bezier(.2,.7,.2,1) 1.1s forwards; }
	.playing .chip    { animation: rise 1.0s cubic-bezier(.2,.7,.2,1) 1.8s forwards; }
	@keyframes rise { to { opacity: 1; transform: translateY(0) scale(1); } }
	.hint {
		position: fixed; inset: auto 0 4vh 0; text-align: center;
		font-size: 1.2vw; color: #45607f; cursor: default;
	}
	.playing .hint { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage">
	<div class="logo">Remit<b>IA</b></div>
	<div class="tagline">Local AI for goods reception</div>
	<div class="chip">100% local &nbsp;·&nbsp; powered by QVAC by Tether</div>
	<p class="hint">F11 para pantalla completa → iniciá la grabación (Win+Alt+R) → clic para lanzar la animación</p>
</div>
<script>
	const stage = document.getElementById('stage');
	document.addEventListener('click', () => {
		stage.classList.remove('playing');
		void stage.offsetWidth;
		stage.classList.add('playing');
	});
</script>
</body>
</html>
